name: Notify mendeleev-data

on:
  release:
    types: [created, published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to mendeleev-data
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.MENDELEEV_DATA_TOKEN }}" \
            https://api.github.com/repos/lmmentel/mendeleev-data/dispatches \
            -d '{"event_type":"mendeleev_${{ github.event.action }}","client_payload":{"version":"${{ github.event.release.tag_name }}"}}'
